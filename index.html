// ─── 3. ENGINE ─────────────────────────────────────────────────
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,SC=0,isLt=false,rot=0;
let camX=0,camY=0,dragS=null,dragged=false;
let hovId=null,actId=null,pOpen=false;
let mxC=-999,myC=-999,rxC=0,ryC=0;
const t0=performance.now();

function rsz(){W=cv.width=innerWidth;H=cv.height=innerHeight;SC=Math.min(W,H);}
rsz();window.addEventListener('resize',rsz);

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(Math.PI*2*v);}
function hRGB(h){return h.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16));}

function npos(n){
  const pw=pOpen?Math.min(460,W):0;
  return{x:n.rx*(W-pw)+camX,y:n.ry*H+camY,r:n.r*(SC*.165)};
}

NODES.forEach(n=>{
  const cnt=Math.round(100+n.r*220);
  n.pts=Array.from({length:cnt},()=>({
    a:Math.random()*Math.PI*2,rr:Math.pow(Math.random(),.5),
    b:Math.pow(Math.random(),1.7),ph:Math.random()*Math.PI*2,
    sp:.18+Math.random()*.65,sz:.5+Math.pow(Math.random(),2)*1.55
  }));
});

const STARS=Array.from({length:340},()=>({
  x:Math.random()*3400-1700,y:Math.random()*2600-1300,
  r:Math.random()*1.1+.2,a:Math.random()*.72+.14,tw:Math.random()*5+2
}));

function drawCloud(n,cx,cy,R,alpha,t){
  if(alpha<.008)return;
  const A=hRGB(n.col);
  ctx.globalCompositeOperation=isLt?'source-over':'lighter';
  n.pts.forEach(p=>{
    const x=cx+Math.cos(p.a)*p.rr*R,y=cy+Math.sin(p.a)*p.rr*R*.92;
    const tw=.56+.44*Math.sin(t*p.sp+p.ph);
    let a=(0.03+p.b*.58)*tw*alpha,sz=p.sz*(.86+p.b*.5);
    if(a<.003)return;
    let r,g,b;
    if(isLt){
      const mix=.48+p.b*.38;
      r=A[0]+(255-A[0])*mix*.42|0;g=A[1]+(255-A[1])*mix*.42|0;b=A[2]+(255-A[2])*mix*.42|0;
      a=Math.min(.7,a*2.0);
    }else{
      const heat=Math.min(1,.04+p.b*1.12);
      const cold=[22,7,52],hot=[255,(145+A[1]*.25)|0,22];
      if(heat<.5){const f=heat/.5;r=cold[0]+(A[0]-cold[0])*f|0;g=cold[1]+(A[1]-cold[1])*f|0;b=cold[2]+(A[2]-cold[2])*f|0;}
      else{const f=(heat-.5)/.5;r=A[0]+(hot[0]-A[0])*f|0;g=A[1]+(hot[1]-A[1])*f|0;b=A[2]+(hot[2]-A[2])*f|0;}
      a=Math.min(.92,a*3.0);
    }
    ctx.fillStyle=`rgba(${r},${g},${b},${a})`;
    ctx.beginPath();ctx.arc(x,y,Math.max(.25,sz),0,Math.PI*2);ctx.fill();
  });
  ctx.globalCompositeOperation='source-over';
}

function drawBubble(cx,cy,R,alpha){
  if(alpha<.008)return;
  const K=isLt?'16,106,88':'14,118,100';
  const g=ctx.createRadialGradient(cx,cy,R*.5,cx,cy,R);
  g.addColorStop(0,`rgba(${K},0)`);
  g.addColorStop(.78,`rgba(${K},${.02*alpha})`);
  g.addColorStop(.93,`rgba(${K},${(isLt?.13:.17)*alpha})`);
  g.addColorStop(.975,`rgba(${K},${(isLt?.56:.54)*alpha})`);
  g.addColorStop(1,`rgba(${K},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=`rgba(${K},${.7*alpha})`;ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,cy,R*.965,-2.55,-1.6);ctx.stroke();
  ctx.strokeStyle=`rgba(${K},${.18*alpha})`;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(cx,cy,R*.95,.42,1.0);ctx.stroke();
}

// ─── 4. MAIN LOOP ──────────────────────────────────────────────
function frame(ts){
  const t=(ts-t0)/1000;
  rot+=.00075;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=isLt?'#ede8d8':'#0d0b18';
  ctx.fillRect(0,0,W,H);

  const cb=Math.cos(rot*.65),sb=Math.sin(rot*.65);
  ctx.globalCompositeOperation=isLt?'source-over':'lighter';
  STARS.forEach(s=>{
    const p=.5+.5*Math.sin(t/s.tw+s.x*.001);
    const rx2=s.x*cb-s.y*sb+W/2+camX*.07,ry2=s.x*sb+s.y*cb+H/2+camY*.07;
    ctx.beginPath();ctx.arc(rx2,ry2,s.r,0,Math.PI*2);
    ctx.fillStyle=isLt?`rgba(68,68,98,${s.a*(.38+.62*p)})`:`rgba(200,212,248,${s.a*(.52+.48*p)})`;
    ctx.fill();
  });
  ctx.globalCompositeOperation='source-over';

  EDGES.forEach(([a,b])=>{
    const na=NODES.find(n=>n.id===a),nb=NODES.find(n=>n.id===b);
    if(!na||!nb)return;
    const pa=npos(na),pb=npos(nb);
    const isA=actId===a||actId===b,isH=hovId===a||hovId===b;
    const al=isA?.52:isH?.2:.08;
    const A=hRGB(na.col);
    const ecx=(pa.x+pb.x)/2+(pb.y-pa.y)*.07,ecy=(pa.y+pb.y)/2+(pa.x-pb.x)*.07;
    ctx.save();
    ctx.setLineDash(isA?[]:[2.5,7]);
    ctx.strokeStyle=isA?`rgba(${A[0]},${A[1]},${A[2]},.95)`:isLt?`rgba(48,48,66,${al})`:`rgba(188,200,240,${al})`;
    ctx.lineWidth=isA?1.5:.6;
    ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.quadraticCurveTo(ecx,ecy,pb.x,pb.y);ctx.stroke();
    ctx.restore();ctx.setLineDash([]);
    if(isA){
      const pr=(t*.42)%1;
      const bx=(1-pr)**2*pa.x+2*(1-pr)*pr*ecx+pr**2*pb.x;
      const by=(1-pr)**2*pa.y+2*(1-pr)*pr*ecy+pr**2*pb.y;
      ctx.beginPath();ctx.arc(bx,by,2.4,0,Math.PI*2);
      ctx.fillStyle=na.col;ctx.globalAlpha=.82;ctx.fill();ctx.globalAlpha=1;
    }
  });

  NODES.forEach(n=>{
    const p=npos(n);
    const isA=actId===n.id,isH=hovId===n.id;
    let al=isA?1:isH?.88:(actId?.2:.76);
    if(isLt)al=Math.min(1,.36+al*.68);
    drawCloud(n,p.x,p.y,p.r,al,t);
    const A=hRGB(n.col);
    const gh=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.3);
    gh.addColorStop(0,`rgba(${A[0]},${A[1]},${A[2]},${isA?.16:.042})`);
    gh.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gh;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.3,0,Math.PI*2);ctx.fill();
    const pulse=.5+.5*Math.sin(t*.62+(n.rx+n.ry)*3.8);
    const Rr=p.r*(isA?1.1:isH?1.06:1);
    drawBubble(p.x,p.y,Rr,(isA?.9:isLt?(.42+.2*pulse):(.26+.18*pulse))*al);
    ctx.beginPath();ctx.arc(p.x,p.y,Rr,0,Math.PI*2);
    ctx.strokeStyle=n.col;ctx.lineWidth=isA?2:1.4;
    ctx.globalAlpha=isA?.82:isLt?(.38+.16*pulse):(.26+.16*pulse);
    ctx.stroke();ctx.globalAlpha=1;
    if(n.area){
      ctx.beginPath();ctx.arc(p.x,p.y,Rr*1.46,0,Math.PI*2);
      ctx.strokeStyle=n.col;ctx.setLineDash([2,6]);ctx.lineWidth=1;
      ctx.globalAlpha=isA?.46:isLt?(.18+.08*pulse):(.12+.08*pulse);
      ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);
    ctx.fillStyle=n.col;ctx.globalAlpha=.85;ctx.fill();ctx.globalAlpha=1;
    if(n.area||isA||isH){
      ctx.font='500 10px JetBrains Mono,monospace';
      ctx.fillStyle=n.col;ctx.globalAlpha=isLt?.72:.65;
      ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText(n.lbl,p.x+Rr+7,p.y);
      ctx.globalAlpha=1;
    }
  });
  mmDraw();pillSync();
  requestAnimationFrame(frame);
}

// ─── 5. MINIMAP ────────────────────────────────────────────────
const mm=document.getElementById('mm'),mmc=mm.getContext('2d');
const MPW=178,MPH=126,MPD=13;
function mmPt(n){return{x:MPD+n.rx*(MPW-2*MPD),y:MPD+n.ry*(MPH-2*MPD)};}
function mmDraw(){
  mmc.clearRect(0,0,MPW,MPH);
  mmc.fillStyle=isLt?'rgba(228,222,208,.62)':'rgba(8,8,22,.62)';
  mmc.fillRect(0,0,MPW,MPH);
  EDGES.forEach(([a,b])=>{
    const na=NODES.find(n=>n.id===a),nb=NODES.find(n=>n.id===b);
    const pa=mmPt(na),pb=mmPt(nb);
    mmc.beginPath();mmc.moveTo(pa.x,pa.y);mmc.lineTo(pb.x,pb.y);
    mmc.strokeStyle=isLt?'rgba(0,0,0,.1)':'rgba(255,255,255,.1)';
    mmc.lineWidth=.8;mmc.stroke();
  });
  NODES.forEach(n=>{
    const p=mmPt(n),isA=n.id===actId;
    mmc.beginPath();mmc.arc(p.x,p.y,isA?5:n.area?3.8:2.5,0,Math.PI*2);
    mmc.fillStyle=n.col;mmc.globalAlpha=isA?1:.58;mmc.fill();mmc.globalAlpha=1;
    if(isA){mmc.beginPath();mmc.arc(p.x,p.y,8,0,Math.PI*2);mmc.strokeStyle=n.col;mmc.lineWidth=1;mmc.globalAlpha=.5;mmc.stroke();mmc.globalAlpha=1;}
  });
}
document.getElementById('mm').addEventListener('click',e=>{
  const r=mm.getBoundingClientRect();
  const fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;
  let best=null,bd=1e9;
  NODES.forEach(n=>{
    const nx=(MPD+n.rx*(MPW-2*MPD))/MPW,ny=(MPD+n.ry*(MPH-2*MPD))/MPH;
    const d=(fx-nx)**2+(fy-ny)**2;
    if(d<bd){bd=d;best=n;}
  });
  if(best)openP(best.id);
});

// ─── 6. PILLS ──────────────────────────────────────────────────
const pillsCont=document.getElementById('pills'),pillsMap={};
NODES.filter(n=>n.area).forEach(n=>{
  const el=document.createElement('div');
  el.className='ap';
  el.style.cssText=`color:${n.col};border-color:${n.col}44;background:${n.col}12`;
  el.innerHTML=`<span class="ad" style="background:${n.col}"></span>${n.lbl}<span class="ae">explore →</span>`;
  el.addEventListener('click',()=>openP(n.id));
  el.addEventListener('mouseenter',()=>{hovId=n.id;tipShow(n);});
  el.addEventListener('mouseleave',()=>{hovId=null;tipHide();});
  pillsCont.appendChild(el);
  pillsMap[n.id]=el;
});
function pillSync(){
  NODES.filter(n=>n.area).forEach(n=>{
    const el=pillsMap[n.id];if(!el)return;
    const p=npos(n);
    el.style.left=p.x+'px';
    el.style.top=(p.y-p.r-24)+'px';
    el.style.opacity=pOpen&&actId!==n.id?'.2':'1';
    el.style.pointerEvents=pOpen&&actId!==n.id?'none':'auto';
  });
}

// ─── 7. TOOLTIP ────────────────────────────────────────────────
const tipEl=document.getElementById('tip');
function tipShow(n){
  const p=npos(n);
  document.getElementById('tdot').style.background=n.col;
  document.getElementById('tnm').textContent=n.lbl;
  document.getElementById('tkc').textContent=n.kicker||'';
  const tg=document.getElementById('tgo');
  tg.textContent=n.area?'AREA · click to explore →':'NODE · click to preview →';
  tg.style.color=n.col;
  tipEl.style.borderColor=n.col;
  tipEl.style.left=p.x+'px';
  tipEl.style.top=(p.y-p.r-.88)+'px';
  tipEl.style.opacity='1';
}
function tipHide(){tipEl.style.opacity='0';}

// ─── 8. PANEL ──────────────────────────────────────────────────
function openP(id){
  const n=NODES.find(n=>n.id===id);if(!n)return;
  actId=id;pOpen=true;hovId=null;tipHide();
  document.getElementById('pat').textContent=n.kicker||'';
  document.getElementById('pb').innerHTML=
    `<span class="pk" style="color:${n.col}">${n.kicker||''}</span>
     <h2 style="background:linear-gradient(118deg,${n.col},${n.col}80);-webkit-background-clip:text;background-clip:text">${n.title||n.lbl}</h2>
     <p class="pl">${n.body||''}</p>
     ${PCONT[id]||''}`;
  document.getElementById('pnl').classList.add('open');
  document.getElementById('pnl').scrollTop=0;
  document.querySelectorAll('.tb').forEach(t=>{
    const on=t.dataset.id===id;
    t.classList.toggle('on',on);
    if(on){t.style.background=n.col;t.style.color='#06070d';t.style.borderColor=n.col;}
    else{t.style.background='';t.style.color='';t.style.borderColor='';}
  });
}
function closeP(){
  document.getElementById('pnl').classList.remove('open');
  pOpen=false;actId=null;
  document.querySelectorAll('.tb').forEach(t=>{
    t.classList.remove('on');t.style.background='';t.style.color='';t.style.borderColor='';
  });
  const def=document.querySelector('.tb[data-id="aroop"]');
  if(def){def.classList.add('on');def.style.background='#64ffda';def.style.color='#06070d';def.style.borderColor='#64ffda';}
}
document.getElementById('pbk').addEventListener('click',closeP);
document.getElementById('clr').addEventListener('click',closeP);
document.querySelectorAll('.tb').forEach(t=>t.addEventListener('click',()=>openP(t.dataset.id)));

// ─── 10. COPY TO CLIPBOARD ─────────────────────────────────────
function cpTxt(txt,label){
  const toast=document.getElementById('cp_toast');
  const show=(msg)=>{if(toast){toast.textContent=msg;toast.style.display='block';toast.style.color='#64ffda';setTimeout(()=>{toast.style.display='none';},2600);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>show(`✓ ${label} copied!`)).catch(()=>show('Could not copy — please copy manually'));
  }else{
    const el=document.createElement('textarea');
    el.value=txt;el.style.cssText='position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(el);el.select();
    try{document.execCommand('copy');show(`✓ ${label} copied!`);}catch(err){show('Could not copy — please copy manually');}
    document.body.removeChild(el);
  }
}

// ─── 11. THEME ─────────────────────────────────────────────────
document.getElementById('thm').addEventListener('click',()=>{
  isLt=!isLt;
  document.body.classList.toggle('LT',isLt);
  document.getElementById('thm').textContent=isLt?'☾ Dark':'☀ Light';
});

// ─── 12. CURSOR ────────────────────────────────────────────────
const crEl=document.getElementById('cr'),rgEl=document.getElementById('rg');
document.addEventListener('mousemove',e=>{
  mxC=e.clientX;myC=e.clientY;
  crEl.style.left=mxC+'px';crEl.style.top=myC+'px';
  if(dragS&&!pOpen){
    const dx=mxC-dragS.cx,dy=myC-dragS.cy;
    if(Math.hypot(dx,dy)>4)dragged=true;
    if(dragged){camX=dragS.camX+dx*.28;camY=dragS.camY+dy*.28;}
  }
  let hit=null;
  NODES.forEach(n=>{const p=npos(n);if(Math.hypot(mxC-p.x,myC-p.y)<p.r+38)hit=n;});
  if(hit){
    hovId=hit.id;crEl.style.background=hit.col;rgEl.style.borderColor=hit.col;
    crEl.style.transform='translate(-50%,-50%) scale(2.2)';rgEl.style.opacity='.9';
    cv.style.cursor='pointer';tipShow(hit);
  }else{
    hovId=null;tipHide();
    crEl.style.background='#64ffda';rgEl.style.borderColor='#64ffda';
    crEl.style.transform='translate(-50%,-50%) scale(1)';rgEl.style.opacity='.48';
    cv.style.cursor=dragS&&dragged?'grabbing':'crosshair';
  }
});
setInterval(()=>{rxC+=(mxC-rxC)*.11;ryC+=(myC-ryC)*.11;rgEl.style.left=rxC+'px';rgEl.style.top=ryC+'px';},14);

// ─── 13. INTERACTION ───────────────────────────────────────────
function hitTest(x,y){
  let hit=null;
  NODES.forEach(n=>{const p=npos(n);if(Math.hypot(x-p.x,y-p.y)<p.r+40)hit=n;});
  return hit;
}
cv.addEventListener('mousedown',e=>{dragS={cx:e.clientX,cy:e.clientY,camX,camY};dragged=false;});
cv.addEventListener('mouseup',e=>{
  if(!dragged){const hit=hitTest(e.clientX,e.clientY);if(hit)openP(hit.id);else if(!pOpen)closeP();}
  dragS=null;dragged=false;
});
let tDragS=null,tDragged=false;
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===1){const t=e.touches[0];tDragS={cx:t.clientX,cy:t.clientY,camX,camY};tDragged=false;}
},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(tDragS&&e.touches.length===1){
    const t=e.touches[0],dx=t.clientX-tDragS.cx,dy=t.clientY-tDragS.cy;
    if(Math.hypot(dx,dy)>9)tDragged=true;
    if(tDragged){camX=tDragS.camX+dx*.28;camY=tDragS.camY+dy*.28;}
  }
},{passive:true});
cv.addEventListener('touchend',e=>{
  if(!tDragged&&e.changedTouches.length){
    const t=e.changedTouches[0],hit=hitTest(t.clientX,t.clientY);
    if(hit)openP(hit.id);else if(!pOpen)closeP();
  }
  tDragS=null;tDragged=false;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeP();});

// ─── 14. TAB INIT ──────────────────────────────────────────────
document.querySelectorAll('.tb').forEach(t=>{
  const n=NODES.find(n=>n.id===t.dataset.id);if(!n)return;
  t.querySelector('i').style.background=n.col;
  if(t.classList.contains('on')){t.style.background=n.col;t.style.color='#06070d';t.style.borderColor=n.col;}
});

// ─── 15. SPLASH ────────────────────────────────────────────────
const sp=document.getElementById('sp');
function dismissSp(){sp.style.opacity='0';setTimeout(()=>sp.remove(),920);}
sp.addEventListener('click',dismissSp);
sp.addEventListener('touchend',dismissSp);

// ─── START ─────────────────────────────────────────────────────
requestAnimationFrame(frame);
